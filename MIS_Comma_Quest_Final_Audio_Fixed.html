let activeSound = null;
function stopSound() {
  for (const audio of [bravoAudio, oopsAudio]) { audio.pause(); audio.currentTime = 0; }
  activeSound = null;
}
function sound(ok) {
  stopSound();
  const clip = ok ? bravoAudio : oopsAudio;
  activeSound = clip;
  clip.currentTime = 0;
  const p = clip.play();
  if (p && p.catch) p.catch(() => {});
}
function feedback(ok,msg){sound(ok);document.getElementById('feedback').textContent=msg;document.getElementById('feedback').style.color=ok?'#168a60':'#d85656'}
function finish(){if(done)return;done=true;stars++;document.getElementById('stars').textContent='⭐ '+stars;document.getElementById('next').disabled=false;feedback(true,'🌟 Bravo! Great job!');}
function wrong(el){feedback(false,'Oops! Try again!');el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),650)}
function render(){stopSound();done=false;chosenLeft=null;pairsDone=new Set();let a=activities[i],g=document.getElementById('game');document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('next').textContent=i===activities.length-1?'Finish 🏆':'Next ➜';document.getElementById('mode').textContent=({insert:'✍️ Insert the Comma',tf:'✅ True or False',tap:'👆 Tap the Correct Sentence',match:'🔗 Match the Sentences'})[a.type];document.getElementById('count').textContent='Activity '+(i+1)+' of '+activities.length;document.getElementById('bar').style.width=(i/activities.length*100)+'%';g.innerHTML='';if(a.type==='insert'){
g.innerHTML='<div class="prompt">Tap the + to put commas in the right places.</div><div class="words" id="words"></div><p class="small">Find all the commas before moving on.</p>';
let w=document.getElementById('words');
let required=(a.after===2 && a.words.length===6)?[2,3]:[a.after];
let placed=new Set();
a.words.forEach((word,j)=>{
let slot=document.createElement('span');slot.className='plus-slot';
let label=document.createElement('span');label.className='word';label.textContent=word;slot.append(label);
if(j<a.words.length-1){
let b=document.createElement('button');b.type='button';b.className='plus-btn';b.textContent='+';b.setAttribute('aria-label','Add comma after '+word);
b.onclick=()=>{if(done||placed.has(j))return;if(required.includes(j)){placed.add(j);b.textContent=',';b.classList.add('correct');b.disabled=true;label.classList.add('correct');if(placed.size===required.length){w.querySelectorAll('.plus-btn').forEach(x=>x.disabled=true);finish()}else{document.getElementById('feedback').textContent='Great! Find the next comma.';document.getElementById('feedback').style.color='#168a60'}}else wrong(b)};
slot.append(b)
}w.append(slot)
})}
if(a.type==='tf'){g.innerHTML='<div class="prompt">Is the comma used correctly?</div><div class="sentence">'+a.sentence+'</div><div class="choices"><button class="choice" data-answer="true">✔ True</button><button class="choice" data-answer="false">✘ False</button></div><div id="correction" class="small"></div>';g.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;if((b.dataset.answer==='true')===a.answer){b.classList.add('correct');if(a.fix)document.getElementById('correction').textContent='Correct sentence: '+a.fix;finish()}else wrong(b)})}
if(a.type==='tap'){g.innerHTML='<div class="prompt">Tap the sentence with the correct commas.</div><div class="choices"></div>';a.options.forEach((opt,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=opt;b.onclick=()=>{if(done)return;if(j===a.answer){b.classList.add('correct');finish()}else wrong(b)};g.querySelector('.choices').append(b)})}
if(a.type==='match'){g.innerHTML='<div class="prompt">Tap a wrong sentence, then tap its correct match.</div><div class="matching"><div id="left"></div><div id="right"></div></div><div id="lines"></div>';let left=document.getElementById('left'),right=document.getElementById('right');a.pairs.forEach(([bad],j)=>{let b=document.createElement('button');b.className='match';b.textContent=bad;b.dataset.idx=j;b.onclick=()=>{if(pairsDone.has(j))return;chosenLeft=j;left.querySelectorAll('.match').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('feedback').textContent='Now choose the correct sentence!'};left.append(b)});let shuffled=a.pairs.map((p,j)=>({text:p[1],j})).sort((x,y)=>([2,0,1][x.j]-[2,0,1][y.j]));shuffled.forEach(({text,j})=>{let b=document.createElement('button');b.className='match';b.textContent=text;b.onclick=()=>{if(chosenLeft===null){feedback(false,'Choose a sentence on the left first!');return}if(j===chosenLeft){pairsDone.add(j);let lb=left.querySelector('[data-idx="'+j+'"]');lb.classList.remove('selected');lb.classList.add('matched');b.classList.add('matched');lb.disabled=true;b.disabled=true;document.getElementById('lines').innerHTML+='<div class="matchline">✔ '+a.pairs[j][0]+' → '+text+'</div>';chosenLeft=null;if(pairsDone.size===a.pairs.length)finish();else {document.getElementById('feedback').textContent='✔ Match found!';document.getElementById('feedback').style.color='#168a60'}}else wrong(b)};right.append(b)})}}
document.getElementById('next').onclick=()=>{if(!done)return;stopSound();done=false;document.getElementById('next').disabled=true;i++;if(i>=activities.length){document.getElementById('bar').style.width='100%';document.getElementById('mode').textContent='🏆 Completed!';document.getElementById('count').textContent='20 of 20';document.getElementById('game').innerHTML='<div class="celebrate">🏆🎉🌟</div><h1 style="text-align:center">Amazing Work!</h1><p class="prompt" style="text-align:center">You finished all 20 activities!</p>';document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true}else render()};document.getElementById('restart').onclick=()=>{i=0;stars=0;document.getElementById('stars').textContent='⭐ 0';render()};render();
</script></body></html>
